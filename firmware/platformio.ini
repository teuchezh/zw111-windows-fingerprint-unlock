; ZW111 fingerprint -> Windows Credential Provider token device
;   pio run -e yd_rp2040 -t upload   (VCC-GND YD-RP2040: кнопка USR на GP24 или BOOT)
;   pio run -e pico -t upload        (Raspberry Pi Pico / любая плата RP2040)
;   pio run -e esp32s3 -t upload     (ESP32-S3 с нативным USB; не проверялось на железе)
;   pio device monitor               (115200, команда HELLO -> OK ZWCP 1 <prov> <templates>)

[platformio]
default_envs = yd_rp2040
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
monitor_eol = LF
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
build_flags =
    -DZW_SENSOR_BAUD=57600

; --- RP2040: ядро earlephilhower (нужно для BOOTSEL, rp2040.hwrand32, EEPROM) ---
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
board_build.filesystem_size = 0m
build_flags =
    ${env.build_flags}
    -DZW_SENSOR_TX=0      ; GP0 -> ZW111 RX
    -DZW_SENSOR_RX=1      ; GP1 <- ZW111 TX
    ; Block the core's "open at 1200 baud = reboot to bootloader" so no program on the PC can reflash the
    ; board silently. Updates use the BOOTLOADER command (button held) or holding BOOT while plugging in.
    -DZW_BLOCK_1200BPS_RESET
    -Wl,--wrap=tud_cdc_line_coding_cb
; pio "upload" can no longer reset the board by itself: hold BOOT while plugging it in first.
upload_protocol = picotool

; --- VCC-GND YD-RP2040 (USB-C, кнопки BOOT/USR/RST, WS2812 на GP23) ---
[env:yd_rp2040]
extends = env:pico
board = vccgnd_yd_rp2040
build_flags =
    ${env:pico.build_flags}
    -DZW_PRESENCE_PIN=24  ; кнопка USR (активный низкий уровень); BOOT тоже работает

; Pico W, Waveshare RP2040-Zero и т.п.: смените board, остальное то же
; [env:pico_w]
; extends = env:pico
; board = rpipicow

; --- ESP32-S3: Serial через нативный USB, кнопка BOOT (GPIO0) вместо BOOTSEL ---
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DZW_SENSOR_TX=17     ; GPIO17 -> ZW111 RX
    -DZW_SENSOR_RX=18     ; GPIO18 <- ZW111 TX
    -DZW_PRESENCE_PIN=0   ; кнопка BOOT
