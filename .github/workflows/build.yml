name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: crypto self-test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and run test vectors (C++)
        run: |
          g++ -O2 -Wall -o /tmp/test_crypto tests/test_crypto.cpp
          python3 tests/test_crypto.py /tmp/test_crypto
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build and run test vectors (C# core)
        run: |
          dotnet build windows/ZwSetup/ZwSetup.CoreCheck -c Release --nologo -v q
          dotnet run --project windows/ZwSetup/ZwSetup.CoreCheck -c Release --no-build > /tmp/cs_vectors.txt
          printf '#!/bin/sh\ncat /tmp/cs_vectors.txt\n' > /tmp/cs_vectors.sh && chmod +x /tmp/cs_vectors.sh
          python3 tests/test_crypto.py /tmp/cs_vectors.sh

  firmware:
    name: firmware (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: yd_rp2040
            artifact: firmware/.pio/build/yd_rp2040/firmware.uf2
            experimental: false
          - env: pico
            artifact: firmware/.pio/build/pico/firmware.uf2
            experimental: false
          - env: esp32s3
            artifact: firmware/.pio/build/esp32s3/firmware.bin
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - name: Check that the 1200-baud reboot is blocked (RP2040)
        if: matrix.env != 'esp32s3'
        run: |
          OBJDUMP=$(ls ~/.platformio/packages/toolchain-rp2040-earlephilhower/bin/arm-none-eabi-objdump)
          "$OBJDUMP" -d firmware/.pio/build/${{ matrix.env }}/firmware.elf > /tmp/dis.txt
          grep -q "<__wrap_tud_cdc_line_coding_cb>:" /tmp/dis.txt
          wrapped=$(grep -cE "\sb(l|\.w)?\s+[0-9a-f]+ <__wrap_tud_cdc_line_coding_cb>" /tmp/dis.txt || true)
          direct=$(grep -cE "\sb(l|\.w)?\s+[0-9a-f]+ <tud_cdc_line_coding_cb>" /tmp/dis.txt || true)
          echo "calls through the wrapper: $wrapped; direct calls (only the wrapper itself may make one): $direct"
          test "$wrapped" -ge 1 && test "$direct" -le 1
      - uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.env }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  windows-msvc:
    name: Windows binaries (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Build (x64 Native Tools environment)
        working-directory: windows
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          build.bat
      - name: Check that UTF-8 source strings survived compilation
        shell: pwsh
        run: |
          $checks = @{ "windows/build/zwsetup-gui.exe" = "Порядок"; "windows/build/zwsetup.exe" = "Конфигурация"; "windows/build/ZwCredProv.dll" = "Отпечаток пальца" }
          foreach ($f in $checks.Keys) {
            $bytes = [IO.File]::ReadAllBytes($f)
            $hex = [BitConverter]::ToString($bytes) -replace '-'
            $needle = [BitConverter]::ToString([Text.Encoding]::Unicode.GetBytes($checks[$f])) -replace '-'
            if ($hex -notmatch $needle) { Write-Error "UTF-16 string '$($checks[$f])' not found in $f (source read in wrong code page?)"; exit 1 }
            Write-Host "OK: $f"
          }
      - uses: actions/upload-artifact@v5
        with:
          name: windows-msvc
          path: |
            windows/build/ZwCredProv.dll
            windows/build/zwsetup.exe
            windows/build/zwsetup-gui.exe
          if-no-files-found: error

  windows-mingw:
    name: Windows binaries (mingw-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build
        working-directory: windows
        run: make
      - uses: actions/upload-artifact@v5
        with:
          name: windows-mingw
          path: |
            windows/build/ZwCredProv.dll
            windows/build/zwsetup.exe
            windows/build/zwsetup-gui.exe
          if-no-files-found: error

  windows-app:
    name: Setup app (WPF-UI, .NET 8)
    needs: [firmware]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Bundle the RP2040 firmware into the app
        uses: actions/download-artifact@v6
        with:
          pattern: firmware-*
          path: fw
      - name: Place firmware images and version
        shell: pwsh
        run: |
          $dst = "windows/ZwSetup/ZwSetup.App/Firmware"
          foreach ($b in "yd_rp2040", "pico") {
            Copy-Item "fw/firmware-$b/firmware.uf2" "$dst/firmware-$b.uf2"
          }
          $v = (Select-String -Path firmware/src/main.cpp -Pattern '#define FW_VERSION\s+"([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path "$dst/firmware-version.txt" -Value $v -NoNewline
          Get-ChildItem $dst
      - name: Publish self-contained single file
        run: dotnet publish windows/ZwSetup/ZwSetup.App -c Release --nologo -v q
      - name: Smoke-run the app (opens every page, both languages, both themes)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = "windows/ZwSetup/ZwSetup.App/bin/Release/net8.0-windows/win-x64/publish/ZwSetup.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait -NoNewWindow
          if (Test-Path smoke.log) { Get-Content smoke.log } else { Write-Host "(no smoke.log written)" }
          if ($p.ExitCode -ne 0) { Write-Error "ZwSetup.exe --smoke exited with $($p.ExitCode)"; exit 1 }
          Write-Host "smoke ok"
      - uses: actions/upload-artifact@v5
        with:
          name: windows-app
          path: windows/ZwSetup/ZwSetup.App/bin/Release/net8.0-windows/win-x64/publish/ZwSetup.exe
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, firmware, windows-msvc, windows-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
      - name: Assemble release archive
        run: |
          set -e
          V="${GITHUB_REF_NAME}"
          R="zw111-windows-fingerprint-unlock-${V}"
          mkdir -p "$R/windows" "$R/firmware"
          cp dist/windows-msvc/* "$R/windows/"
          cp dist/windows-app/ZwSetup.exe "$R/windows/"
          cp dist/firmware-yd_rp2040/firmware.uf2 "$R/firmware/firmware-yd_rp2040.uf2"
          cp dist/firmware-pico/firmware.uf2 "$R/firmware/firmware-pico.uf2"
          [ -f dist/firmware-esp32s3/firmware.bin ] && cp dist/firmware-esp32s3/firmware.bin "$R/firmware/firmware-esp32s3.bin" || true
          cp README.md README.ru.md LICENSE "$R/"
          zip -r "$R.zip" "$R"
          ls -la "$R.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: zw111-windows-fingerprint-unlock-*.zip
          generate_release_notes: true
